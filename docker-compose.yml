services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/marks.json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong random value, e.g. openssl rand -hex 32}
    volumes:
      - marks-data:/app/data
    restart: unless-stopped
volumes:
  marks-data:
